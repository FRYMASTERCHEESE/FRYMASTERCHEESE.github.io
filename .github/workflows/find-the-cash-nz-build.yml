name: Find The Cash NZ website and Android
on:
  pull_request:
    paths:
      - 'find-the-cash-nz/**'
      - '.github/workflows/find-the-cash-nz-build.yml'
  push:
    branches: [main]
    paths:
      - 'find-the-cash-nz/**'
      - '.github/workflows/find-the-cash-nz-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    name: Validate community website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and page references
        shell: bash
        run: |
          node --check find-the-cash-nz/app.js
          node --check find-the-cash-nz/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('find-the-cash-nz')
          html=(root/'index.html').read_text()
          assert '<html lang="en-NZ">' in html
          for file in ['styles.css','app.js','assets/logo.svg','sw.js','privacy.html','safety.html','terms.html','updates.json','manifest.webmanifest']:
              assert (root/file).exists(),file
          updates=json.loads((root/'updates.json').read_text())
          assert updates['connected'] is False and updates['posts']==[]
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          assert manifest['start_url']=='./'
          assert 'https://www.facebook.com/FindTheCashNz/' in html
          assert 'findthecashnz@gmail.com' in html
          print('Find The Cash NZ page and configuration tests passed')
          PY
  android:
    name: Build native Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android API
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile native Android app
        run: gradle -p find-the-cash-nz/android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: find-the-cash-nz-debug-apk
          path: find-the-cash-nz/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
